[install]
minimumReleaseAge = 604800
# Packages exempt from the cooldown (our own published packages, the TypeScript
# toolchain we bump often, and MCP servers we run via `bunx` pinned to `@latest`).
# bun matches EXACT names only — no glob (oven-sh/bun#28967).
minimumReleaseAgeExcludes = [
  "@sablier/devkit",
  "@sablier/indexers",
  "@sablier/price-data",
  "@types/node",
  "@typescript/native-preview",
  "chrome-devtools-mcp",
  "sablier",
  "typescript",
]
