# bun reads its global config from $XDG_CONFIG_HOME/.bunfig.toml whenever that
# variable is set - dot_zshenv always sets it - and never falls back to
# ~/.bunfig.toml in that case. Living at the home path left minimumReleaseAge
# inert: bun took every release regardless of age while the file looked correct.

[install]
  minimumReleaseAge = 604800
  # Packages exempt from the cooldown (our own published packages, the TypeScript
  # toolchain we bump often, the Effect-TS ecosystem used in sablier/new-ui, and
  # globally installed MCP servers we may bump immediately).
  # bun matches EXACT names only — no glob (oven-sh/bun#28967).
  minimumReleaseAgeExcludes = [
    "@effect-atom/atom",
    "@effect-atom/atom-react",
    "@effect/cli",
    "@effect/experimental",
    "@effect/opentelemetry",
    "@effect/platform",
    "@effect/platform-node",
    "@effect/rpc",
    "@effect/vitest",
    "@prb/effect-evm",
    "@prb/effect-evm-safe",
    "@prb/effect-next",
    "@prb/effect-solana",
    "@prb/effect-xstate",
    "@prb/math",
    "@sablier/devkit",
    "@sablier/indexers",
    "@sablier/price-data",
    "@types/node",
    "@typescript/native-preview",
    "chrome-devtools-mcp",
    "effect",
    "react-grab",
    "sablier",
    "typescript",
  ]
