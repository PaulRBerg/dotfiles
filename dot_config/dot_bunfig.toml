# Bun reads $XDG_CONFIG_HOME/.bunfig.toml when XDG_CONFIG_HOME is set.
# ~/.bunfig.toml links here for processes without XDG_CONFIG_HOME.

[install]
  minimumReleaseAge = 604800
  # Packages exempt from the cooldown (our own published packages, the TypeScript
  # toolchain we bump often, the Effect-TS ecosystem used in sablier/new-ui, and
  # globally installed MCP servers we may bump immediately).
  # bun matches EXACT names only — no glob (oven-sh/bun#28967).
  # Keep identical to minimumReleaseAgeExclude in ~/.config/pnpm/config.yaml;
  # tests/release_age_excludes.bats enforces it.
  minimumReleaseAgeExcludes = [
    "@effect-atom/atom",
    "@effect-atom/atom-react",
    "@effect/cli",
    "@effect/experimental",
    "@effect/opentelemetry",
    "@effect/platform",
    "@effect/platform-node",
    "@effect/rpc",
    "@effect/vitest",
    "@prb/crypto-registry",
    "@prb/devkit",
    "@prb/effect-evm",
    "@prb/effect-evm-safe",
    "@prb/effect-next",
    "@prb/effect-solana",
    "@prb/effect-xstate",
    "@prb/math",
    "@sablier/devkit",
    "@sablier/indexers",
    "@sablier/price-data",
    "@types/node",
    "@typescript/native-preview",
    "chrome-devtools-mcp",
    "effect",
    "react-grab",
    "sablier",
    "typescript",
  ]
