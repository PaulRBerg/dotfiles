# Bun reads $XDG_CONFIG_HOME/.bunfig.toml when XDG_CONFIG_HOME is set.
# ~/.bunfig.toml links here for processes without XDG_CONFIG_HOME.

[install]
  minimumReleaseAge = 604800
  # Packages exempt from the cooldown (our own published packages, the TypeScript
  # toolchain we bump often, the Effect-TS ecosystem used in sablier/new-ui,
  # the Medusa backend packages used in 28zile, the
  # ultracite lint presets that @prb/devkit tracks, and globally installed MCP
  # servers we may bump immediately).
  # bun matches EXACT names only — no glob (oven-sh/bun#28967).
  # Keep identical to minimumReleaseAgeExclude in ~/.config/pnpm/config.yaml and
  # min-release-age-exclude in ~/.config/npm/npmrc;
  # tests/release_age_excludes.bats enforces it.
  minimumReleaseAgeExcludes = [
    "@effect-atom/atom",
    "@effect-atom/atom-react",
    "@effect/cli",
    "@effect/experimental",
    "@effect/opentelemetry",
    "@effect/platform",
    "@effect/platform-browser",
    "@effect/platform-bun",
    "@effect/platform-node",
    "@effect/platform-node-shared",
    "@effect/rpc",
    "@effect/vitest",
    "@medusajs/admin-bundler",
    "@medusajs/admin-sdk",
    "@medusajs/admin-shared",
