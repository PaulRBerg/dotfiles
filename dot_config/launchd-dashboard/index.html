<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LaunchAgents</title>
    <style>
      :root {
        color-scheme: dark light;
        --bg: #0f1418;
        --surface: #161d22;
        --surface-2: #1d262d;
        --line: #26323a;
        --text: #dbe4ea;
        --muted: #8698a4;
        --ok: #4cc38a;
        --fail: #f0616d;
        --warn: #e9a23b;
        --run: #59a8f5;
        --strip: #222d35;
        --always: #2f6f55;
        --mono: ui-monospace, "SF Mono", Menlo, monospace;
      }
      @media (prefers-color-scheme: light) {
        :root {
          --bg: #eef2f5;
          --surface: #ffffff;
          --surface-2: #f4f7f9;
          --line: #d9e1e7;
          --text: #18232b;
          --muted: #5d6f7b;
          --ok: #198754;
          --fail: #c9303e;
          --warn: #b06d00;
          --run: #1f6fc4;
          --strip: #e3e9ee;
          --always: #9fd5bc;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 system-ui,
          -apple-system,
          sans-serif;
        font-variant-numeric: tabular-nums;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: baseline;
        gap: 8px 24px;
        padding: 20px 24px 12px;
      }
      h1 {
        margin: 0;
        font-size: 20px;
        font-weight: 650;
      }
      .totals {
        display: flex;
        gap: 18px;
        color: var(--muted);
      }
      .totals span {
        white-space: nowrap;
      }
      .totals b {
        color: var(--text);
        font-weight: 600;
      }
      .controls {
        margin-left: auto;
        display: flex;
        gap: 16px;
        align-items: center;
        color: var(--muted);
      }
      main {
        padding: 0 24px 32px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        overflow: hidden;
      }
      th {
        text-align: left;
        font-weight: 500;
        color: var(--muted);
        font-size: 12px;
        padding: 8px 10px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
      }
      th.strip-head {
        position: relative;
        min-width: 280px;
      }
      .hours {
        display: flex;
        justify-content: space-between;
      }
      td {
        white-space: nowrap;
        padding: 9px 10px;
        border-bottom: 1px solid var(--line);
        vertical-align: middle;
      }
      tr.agent {
        --row: var(--surface);
        cursor: pointer;
        background: var(--row);
      }
      tr.agent:hover,
      tr.agent:focus-visible,
      tr.agent[aria-expanded="true"] {
        --row: var(--surface-2);
        outline: none;
      }
      tr.group td {
        padding: 14px 10px 6px;
        background: var(--bg);
        color: var(--muted);
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }
      tr.group:first-child td {
        padding-top: 8px;
      }
      tr.group .count {
        margin-left: 6px;
        font-weight: 500;
        letter-spacing: 0;
      }
      .agent-id {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .icon {
        position: relative;
        flex: none;
        display: grid;
        place-items: center;
        width: 30px;
        height: 30px;
        border-radius: 8px;
        color: var(--accent);
        background: color-mix(in srgb, var(--accent) 16%, transparent);
      }
      .icon svg {
        width: 17px;
        height: 17px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .names {
        display: flex;
        flex-direction: column;
        min-width: 0;
      }
      .name {
        font-weight: 550;
      }
      .desc {
        color: var(--muted);
        font-size: 12px;
      }
      .icon .dot {
        position: absolute;
        right: -3px;
        bottom: -3px;
        width: 10px;
        height: 10px;
        border-radius: 50%;
        border: 2px solid var(--row);
        background: var(--muted);
      }
      .dot.running {
        background: var(--run);
        box-shadow: 0 0 0 3px color-mix(in srgb, var(--run) 25%, transparent);
      }
      .dot.ok {
        background: var(--ok);
      }
      .dot.fail {
        background: var(--fail);
      }
      .icon .dot.unloaded {
        background: var(--row);
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
      }
      .tag {
        margin-left: 6px;
        font-size: 11px;
        color: var(--muted);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 0 4px;
      }
      .fail-text {
        color: var(--fail);
      }
      .ok-text {
        color: var(--ok);
      }
      .warn-text {
        color: var(--warn);
      }
      .strip {
        position: relative;
        height: 18px;
        background: var(--strip);
        border-radius: 3px;
        min-width: 280px;
      }
      .strip .always {
        position: absolute;
        inset: 6px 0;
        background: var(--always);
        border-radius: 2px;
      }
      .strip .periodic {
        position: absolute;
        inset: 6px 0;
        background: repeating-linear-gradient(90deg, var(--warn) 0 2px, transparent 2px var(--tick, 12px));
        opacity: 0.55;
      }
      .strip .fire {
        position: absolute;
        top: 2px;
        bottom: 2px;
        width: 2px;
        margin-left: -1px;
        background: var(--warn);
        border-radius: 1px;
      }
      .strip .run {
        position: absolute;
        top: 5px;
        width: 8px;
        height: 8px;
        margin-left: -4px;
        border-radius: 50%;
        background: var(--run);
        border: 1.5px solid var(--surface);
      }
      .strip .run.ok {
        background: var(--ok);
      }
      .strip .run.fail {
        background: var(--fail);
      }
      .strip .now {
        position: absolute;
        top: -3px;
        bottom: -3px;
        width: 1px;
        background: var(--text);
        opacity: 0.6;
      }
      tr.detail td {
        white-space: normal;
        background: var(--surface-2);
        padding: 4px 16px 18px;
      }
      .detail-grid {
        /* Zero intrinsic width so long log lines never widen the table columns. */
        width: 0;
        min-width: 100%;
        display: grid;
        grid-template-columns: minmax(260px, 1fr) minmax(0, 2.2fr);
        gap: 20px;
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 4px 12px;
        margin: 8px 0;
      }
      dt {
        color: var(--muted);
      }
      dd {
        margin: 0;
        overflow-wrap: anywhere;
      }
      a {
        color: var(--run);
      }
      code,
      pre {
        font-family: var(--mono);
        font-size: 12px;
      }
      h3 {
        font-size: 13px;
        font-weight: 600;
        margin: 14px 0 6px;
      }
      .history {
        list-style: none;
        margin: 0;
        padding: 0;
        max-height: 220px;
        overflow: auto;
      }
      .history li {
        padding: 2px 0;
      }
      .log-head {
        display: flex;
        flex-wrap: wrap;
        gap: 4px 12px;
        align-items: baseline;
        margin: 14px 0 6px;
      }
      .log-head h3 {
        margin: 0;
      }
      pre.log {
        margin: 0;
        padding: 10px 12px;
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 6px;
        max-height: 360px;
        overflow: auto;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }
      pre.log .err {
        color: var(--fail);
      }
      label.toggle {
        display: inline-flex;
        gap: 6px;
        align-items: center;
        cursor: pointer;
      }
      .empty {
        color: var(--muted);
        padding: 24px;
        text-align: center;
      }
      .tabs {
        display: flex;
        gap: 4px;
      }
      .tabs a {
        padding: 3px 10px;
        border-radius: 6px;
        color: var(--muted);
        font-weight: 500;
        text-decoration: none;
      }
      .tabs a:hover {
        color: var(--text);
      }
      .tabs a[aria-selected="true"] {
        color: var(--text);
        background: var(--surface);
        box-shadow: inset 0 0 0 1px var(--line);
      }
      body[data-tab="sleep"] #totals,
      body[data-tab="sleep"] #third-party-toggle {
        display: none;
      }
      .notice {
        margin: 0 0 16px;
        color: var(--muted);
      }
      .hook {
        --row: var(--surface);
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 14px 16px 16px;
        margin-bottom: 16px;
      }
      .hook-head {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 24px;
      }
      .hook-grid {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) minmax(0, 2fr);
        gap: 24px;
      }
      ol.steps {
        margin: 0;
        padding-left: 22px;
      }
      ol.steps li {
        padding: 3px 0;
      }
      ol.steps .sub {
        display: block;
      }
      table.runs {
        border-radius: 6px;
      }
      tr.run {
        cursor: pointer;
      }
      tr.run:hover,
      tr.run:focus-visible,
      tr.run[aria-expanded="true"] {
        background: var(--surface-2);
        outline: none;
      }
      tr.run-output td {
        white-space: normal;
        padding: 0 10px 12px;
        background: var(--surface-2);
      }
      @media (max-width: 900px) {
        .detail-grid,
        .hook-grid {
          grid-template-columns: 1fr;
        }
        .col-runs,
        .col-log {
          display: none;
        }
      }
      @media (max-width: 640px) {
        header,
        main {
          padding-left: 16px;
          padding-right: 16px;
        }
        .controls {
          margin-left: 0;
        }
        .col-strip,
        .col-next,
        .col-exit {
          display: none;
        }
        td {
          white-space: normal;
          overflow-wrap: break-word;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>LaunchAgents</h1>
      <nav class="tabs" role="tablist">
        <a href="#agents" role="tab" data-tab="agents">Agents</a>
        <a href="#sleep" role="tab" data-tab="sleep">Sleep &amp; wake</a>
      </nav>
      <div class="totals" id="totals"></div>
      <div class="controls">
        <label class="toggle" id="third-party-toggle"
          ><input type="checkbox" id="show-third-party" /> Third-party agents</label
        >
        <span id="updated" aria-live="polite"></span>
      </div>
    </header>
    <main id="agents-view">
      <table>
        <thead>
          <tr>
            <th>Agent</th>
            <th>Schedule</th>
            <th>State</th>
            <th class="col-exit">Last exit</th>
            <th class="col-runs">Runs</th>
            <th class="col-log">Log written</th>
            <th class="col-next">Next run</th>
            <th class="strip-head col-strip">
              <div class="hours"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
            </th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </main>
    <main id="sleep-view" hidden></main>
    <script>
      const rows = document.getElementById("rows");
      const showThirdParty = document.getElementById("show-third-party");
      const expanded = new Set();
      const errorsOnly = new Set();
      const sleepView = document.getElementById("sleep-view");
      // Hook kind -> start of the run whose output is open; defaults to the newest run.
      const openRuns = new Map();
      let data = null;
      let hookData = null;
      let tab = "agents";

      try {
        showThirdParty.checked = localStorage.getItem("show-third-party") === "1";
      } catch {}
      showThirdParty.addEventListener("change", () => {
        try {
          localStorage.setItem("show-third-party", showThirdParty.checked ? "1" : "0");
        } catch {}
        render();
      });

      const esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c],
        );
      // Lucide-style 24px stroke icons, keyed by the `icon` field from the server catalog.
      const ICONS = {
        activity: '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
        wallet:
          '<path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/>',
        receipt:
          '<path d="M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z"/><path d="M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8"/><path d="M12 17.5v-11"/>',
        server:
          '<rect width="20" height="8" x="2" y="2" rx="2"/><rect width="20" height="8" x="2" y="14" rx="2"/><path d="M6 6h.01M6 18h.01"/>',
        dashboard:
          '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
        handoff: '<path d="m16 3 4 4-4 4"/><path d="M20 7H4"/><path d="m8 21-4-4 4-4"/><path d="M4 17h16"/>',
        lock: '<rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
        shield:
          '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
        history:
          '<path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l4 2"/>',
        key: '<circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6"/><path d="m15.5 7.5 3 3L22 7l-3-3"/>',
        drive:
          '<path d="M22 12H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M6 16h.01M10 16h.01"/>',
        moon: '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/>',
        sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>',
        download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
        box: '<path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/>',
      };
      const GROUP_COLORS = {
        Finance: "#3fb37f",
        "AI agents": "#9b7cf0",
        "Local web": "#4a9ff0",
        "Shell & SSH": "#d99a2b",
        "Mac health": "#e0708a",
      };
      const icon = (agent) => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[agent.icon] ?? ICONS.box}</svg>`;

      const ERROR_PATTERN = /\b(error|err|fatal|panic|fail(ed|ure)?|exception|traceback)\b/i;

      function relative(iso) {
        if (!iso) return "—";
        const seconds = Math.round((Date.now() - new Date(iso).getTime()) / 1000);
        const future = seconds < 0;
        const abs = Math.abs(seconds);
        const text =
          abs < 60
            ? `${abs}s`
            : abs < 3600
              ? `${Math.round(abs / 60)}m`
              : abs < 86400
                ? `${Math.round(abs / 3600)}h`
                : `${Math.round(abs / 86400)}d`;
        return future ? `in ${text}` : `${text} ago`;
      }

      const clock = (iso) => new Date(iso).toLocaleString([], { weekday: "short", hour: "2-digit", minute: "2-digit" });
      const fullTime = (iso) => new Date(iso).toLocaleString();

      function status(agent) {
        if (!agent.live.loaded) return { cls: "unloaded", text: "not loaded" };
        if (agent.live.pid) {
          const uptime = agent.startedAt ? ` · up ${relative(agent.startedAt).replace(" ago", "")}` : "";
          return { cls: "running", text: `running${uptime}`, title: `pid ${agent.live.pid}` };
        }
        if (agent.lastExitOk === false) return { cls: "fail", text: "idle" };
        if (agent.lastExitOk === true) return { cls: "ok", text: "idle" };
        return { cls: "", text: agent.live.state ?? "idle" };
      }

      function exitCell(agent) {
        const exit = agent.live.lastExit;
        if (!exit) return '<span class="sub">—</span>';
        if (exit.startsWith("(never")) return '<span class="sub">never exited</span>';
        // While a job runs, launchd's last exit belongs to the previous run, so a failure there is history, not an alarm.
        const running = Boolean(agent.live.pid);
        const failCls = running ? "warn-text" : "fail-text";
        const cls = agent.lastExitOk === true ? "ok-text" : agent.lastExitOk === false ? failCls : "sub";
        const text =
          agent.lastExitOk === true ? "0 · success" : agent.lastExitOk === undefined ? "stopped (SIGTERM)" : exit;
        const suffix = running ? ' <span class="sub">· before restart</span>' : "";
        return `<span class="${cls}">${esc(text)}</span>${suffix}`;
      }

      // Today's 24h strip: always-on bar, periodic hatch, calendar fire marks, sampled runs, and the now cursor.
      function strip(agent) {
        const today = new Date();
        const pct = (date) => ((date.getHours() * 60 + date.getMinutes()) / 1440) * 100;
        const parts = [];
        const schedule = agent.schedule;
        if (schedule.keepAlive) parts.push('<div class="always" title="Always on (KeepAlive)"></div>');
        if (schedule.interval) {
          const tickPx = Math.max(3, (schedule.interval / 86400) * 280);
          parts.push(`<div class="periodic" style="--tick:${tickPx}px" title="${esc(schedule.summary)}"></div>`);
        }
        for (const entry of schedule.calendar) {
          if (entry.Month !== undefined && entry.Month !== today.getMonth() + 1) continue;
          if (entry.Day !== undefined && entry.Day !== today.getDate()) continue;
          if (entry.Weekday !== undefined && entry.Weekday % 7 !== today.getDay()) continue;
          const hours = entry.Hour === undefined ? [...Array(24).keys()] : [entry.Hour];
          for (const hour of hours) {
            const left = ((hour * 60 + (entry.Minute ?? 0)) / 1440) * 100;
            parts.push(
              `<div class="fire" style="left:${left}%" title="Scheduled ${String(hour).padStart(2, "0")}:${String(entry.Minute ?? 0).padStart(2, "0")}"></div>`,
            );
          }
        }
        const events = agent.history;
        for (let i = 0; i < events.length; i++) {
          const event = events[i];
          if (event.kind !== "start") continue;
          const at = new Date(event.ts);
          if (at.toDateString() !== today.toDateString()) continue;
          const exit = events.slice(i + 1).find((e) => e.kind === "exit");
          const cls = exit
            ? exit.exit === "0"
              ? "ok"
              : exit.exit === "143" || exit.exit?.endsWith(": 15")
                ? ""
                : "fail"
            : "";
          parts.push(
            `<div class="run ${cls}" style="left:${pct(at)}%" title="Started ${esc(fullTime(event.ts))}${exit ? ` · exit ${esc(exit.exit)}` : ""}"></div>`,
          );
        }
        parts.push(`<div class="now" style="left:${pct(today)}%" title="Now"></div>`);
        return `<div class="strip">${parts.join("")}</div>`;
      }

      function logBlock(agent, log) {
        const key = `${agent.label}:${log.path}`;
        if (!log.exists)
          return `<div class="log-head"><h3>${esc(log.path)}</h3><span class="sub">file does not exist yet</span></div>`;
        const only = errorsOnly.has(key);
        const lines = only ? log.lines.filter((line) => ERROR_PATTERN.test(line)) : log.lines;
        const body = lines.length
          ? lines
              .map((line) => (ERROR_PATTERN.test(line) ? `<span class="err">${esc(line)}</span>` : esc(line)))
              .join("\n")
          : only
            ? "No error lines in the tail."
            : "Empty log.";
        return `
          <div class="log-head">
            <h3>${esc(log.path)}</h3>
            <span class="sub">written ${esc(relative(log.mtime))} · ${(log.size / 1024).toFixed(1)} KB · last ${log.lines.length} lines</span>
            ${log.errorLines ? `<span class="fail-text">${log.errorLines} error line${log.errorLines > 1 ? "s" : ""}</span>` : '<span class="ok-text">no error lines</span>'}
            <label class="toggle sub"><input type="checkbox" data-errors="${esc(key)}" ${only ? "checked" : ""}/> Errors only</label>
          </div>
          <pre class="log" data-log="${esc(key)}">${body}</pre>`;
      }

      function detail(agent) {
        const history = [...agent.history].reverse();
        const historyList = history.length
          ? `<ul class="history">${history
              .map((event) => {
                const ok = event.exit === "0";
                const text =
                  event.kind === "start"
                    ? `<span class="ok-text">▸</span> started${event.pid ? ` · pid ${event.pid}` : ""}`
                    : `<span class="${ok ? "ok-text" : "fail-text"}">■</span> exited${event.exit ? ` · ${esc(event.exit)}` : ""}`;
                return `<li><span class="sub">${esc(fullTime(event.ts))}</span> ${text}</li>`;
              })
              .join("")}</ul>`
          : `<p class="sub">No runs observed yet. The dashboard samples launchd every ${data.sampleSeconds}s and keeps history in <code>${esc(data.historyFile)}</code>.</p>`;
        const logs = agent.logs.length
          ? agent.logs.map((log) => logBlock(agent, log)).join("")
          : '<p class="sub">No log file: the plist sets no StandardOutPath/StandardErrorPath and its script redirects nowhere detectable.</p>';
        return `
          <div class="detail-grid">
            <div>
              <dl>
                <dt>Label</dt><dd><code>${esc(agent.label)}</code></dd>
                ${agent.url ? `<dt>Opens at</dt><dd><a href="${esc(agent.url)}" target="_blank" rel="noopener">${esc(agent.url)}</a></dd>` : ""}
                <dt>Schedule</dt><dd>${esc(agent.schedule.summary)}</dd>
                ${agent.nextRun ? `<dt>Next run</dt><dd>${esc(fullTime(agent.nextRun))}</dd>` : ""}
                <dt>launchd state</dt><dd>${esc(agent.live.loaded ? agent.live.state : "not loaded")}</dd>
                ${agent.startedAt ? `<dt>Running since</dt><dd>${esc(fullTime(agent.startedAt))} <span class="sub">pid ${esc(agent.live.pid)}</span></dd>` : ""}
                <dt>Runs</dt><dd>${esc(agent.live.runs ?? "—")} <span class="sub">since load</span></dd>
                <dt>Plist</dt><dd><code>${esc(agent.path)}</code>${agent.managed ? ' <span class="tag">chezmoi</span>' : ""}</dd>
                ${agent.workingDirectory ? `<dt>Directory</dt><dd><code>${esc(agent.workingDirectory)}</code></dd>` : ""}
                ${agent.schedule.watchPaths.length ? `<dt>Watches</dt><dd><code>${agent.schedule.watchPaths.map(esc).join("<br>")}</code></dd>` : ""}
                ${agent.plistError ? `<dt>Plist error</dt><dd class="fail-text">${esc(agent.plistError)}</dd>` : ""}
              </dl>
              <h3>Program</h3>
              <pre class="log">${esc(agent.program.join(" \n  ")) || "—"}</pre>
              <h3>Observed runs</h3>
              ${historyList}
            </div>
            <div>${logs}</div>
          </div>`;
      }

      function render() {
        if (!data) return;
        const agents = data.agents.filter((agent) => agent.managed || showThirdParty.checked);
        const running = agents.filter((agent) => agent.live.pid).length;
        const failing = agents.filter((agent) => agent.lastExitOk === false && !agent.live.pid).length;
        const scheduled = agents.filter((agent) => agent.schedule.calendar.length || agent.schedule.interval).length;
        document.getElementById("totals").innerHTML =
          `<span><b>${agents.length}</b> agents</span><span><b>${running}</b> running</span><span><b>${scheduled}</b> scheduled</span>` +
          `<span class="${failing ? "fail-text" : ""}"><b class="${failing ? "fail-text" : ""}">${failing}</b> last exit failed</span>`;
        document.getElementById("updated").textContent = `Updated ${new Date(data.generatedAt).toLocaleTimeString()}`;

        // Keep log scroll positions across refreshes.
        const scroll = new Map(
          [...rows.querySelectorAll("pre[data-log]")].map((pre) => [pre.dataset.log, pre.scrollTop]),
        );

        if (!agents.length) {
          rows.innerHTML =
            '<tr><td colspan="8" class="empty">No LaunchAgents found in ~/Library/LaunchAgents.</td></tr>';
          return;
        }
        const groupSizes = new Map();
        for (const agent of agents) groupSizes.set(agent.group, (groupSizes.get(agent.group) ?? 0) + 1);
        rows.innerHTML = agents
          .map((agent, index) => {
            const s = status(agent);
            const groupHead =
              index === 0 || agents[index - 1].group !== agent.group
                ? `<tr class="group"><td colspan="8">${esc(agent.group)}<span class="count">${groupSizes.get(agent.group)}</span></td></tr>`
                : "";
            const open = expanded.has(agent.label);
            const logWrite = agent.lastLogWrite;
            const errorCount = agent.logs.reduce((sum, log) => sum + (log.errorLines ?? 0), 0);
            return `${groupHead}
              <tr class="agent" tabindex="0" data-label="${esc(agent.label)}" aria-expanded="${open}">
                <td>
                  <div class="agent-id">
                    <span class="icon" style="--accent:${GROUP_COLORS[agent.group] ?? "var(--muted)"}">${icon(agent)}<span class="dot ${s.cls}" title="${esc(s.text)}"></span></span>
                    <span class="names">
                      <span class="name" title="${esc(agent.label)}">${esc(agent.name)}${agent.managed ? "" : '<span class="tag">third-party</span>'}</span>
                      <span class="desc">${esc(agent.description)}</span>
                    </span>
                  </div>
                </td>
                <td>${esc(agent.schedule.summary)}</td>
                <td class="${s.cls === "running" ? "" : "sub"}" title="${esc(s.title ?? "")}">${esc(s.text)}</td>
                <td class="col-exit">${exitCell(agent)}</td>
                <td class="col-runs">${esc(agent.live.runs ?? "—")}</td>
                <td class="col-log">${logWrite ? `<span title="${esc(fullTime(logWrite))}">${esc(relative(logWrite))}</span>` : '<span class="sub">—</span>'}${errorCount ? ` <span class="fail-text" title="Error lines in the last 200 log lines">· ${errorCount} err</span>` : ""}</td>
                <td class="col-next">${agent.nextRun ? `<span title="${esc(fullTime(agent.nextRun))}">${esc(clock(agent.nextRun))}</span>` : '<span class="sub">—</span>'}</td>
                <td class="col-strip">${strip(agent)}</td>
              </tr>
              ${open ? `<tr class="detail"><td colspan="8">${detail(agent)}</td></tr>` : ""}`;
          })
          .join("");

        for (const pre of rows.querySelectorAll("pre[data-log]")) {
          pre.scrollTop = scroll.has(pre.dataset.log) ? scroll.get(pre.dataset.log) : pre.scrollHeight;
        }
      }

      function toggle(row) {
        const label = row.dataset.label;
        if (expanded.has(label)) expanded.delete(label);
        else expanded.add(label);
        render();
      }

      rows.addEventListener("click", (event) => {
        const errorsBox = event.target.closest("input[data-errors]");
        if (errorsBox) {
          if (errorsBox.checked) errorsOnly.add(errorsBox.dataset.errors);
          else errorsOnly.delete(errorsBox.dataset.errors);
          render();
          return;
        }
        const row = event.target.closest("tr.agent");
        if (row) toggle(row);
      });
      rows.addEventListener("keydown", (event) => {
        const row = event.target.closest("tr.agent");
        if (row && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          toggle(row);
          rows.querySelector(`tr.agent[data-label="${CSS.escape(row.dataset.label)}"]`)?.focus();
        }
      });

      function duration(start, end) {
        const seconds = Math.round((new Date(end) - new Date(start)) / 1000);
        if (seconds < 60) return `${seconds}s`;
        if (seconds < 3600) return `${Math.floor(seconds / 60)}m ${seconds % 60}s`;
        return `${Math.floor(seconds / 3600)}h ${Math.floor((seconds % 3600) / 60)}m`;
      }

      function runResult(run, index) {
        if (!run.end)
          return index === 0
            ? '<span class="sub">running or interrupted</span>'
            : '<span class="warn-text">no end marker</span>';
        return run.exit === 0
          ? '<span class="ok-text">0 · success</span>'
          : `<span class="fail-text">exit ${run.exit}</span>`;
      }

      function hookCard(hook, live) {
        const latest = hook.runs[0];
        if (!openRuns.has(hook.kind)) openRuns.set(hook.kind, latest?.start ?? null);
        const steps = hook.steps.length
          ? `<ol class="steps">${hook.steps
              .map(
                (step) =>
                  `<li>${esc(step.title)}${step.notes ? `<span class="sub">${esc(step.notes)}</span>` : ""}</li>`,
              )
              .join("")}</ol>`
          : '<p class="sub">No <code># ---</code> section headers found in the script.</p>';
        const runs = hook.runs.length
          ? `<table class="runs"><thead><tr><th>Started</th><th>Duration</th><th>Result</th><th>Errors</th></tr></thead><tbody>${hook.runs
              .map((run, index) => {
                const open = openRuns.get(hook.kind) === run.start;
                const key = `${hook.kind}:${run.start}`;
                const body = run.lines.length
                  ? run.lines
                      .map((line) => (ERROR_PATTERN.test(line) ? `<span class="err">${esc(line)}</span>` : esc(line)))
                      .join("\n")
                  : "No output.";
                return `
                  <tr class="run" tabindex="0" data-kind="${esc(hook.kind)}" data-start="${esc(run.start)}" aria-expanded="${open}">
                    <td title="${esc(fullTime(run.start))}">${esc(clock(run.start))} <span class="sub">${esc(relative(run.start))}</span></td>
                    <td>${run.end ? esc(duration(run.start, run.end)) : '<span class="sub">—</span>'}</td>
                    <td>${runResult(run, index)}</td>
                    <td>${run.errorLines ? `<span class="fail-text">${run.errorLines}</span>` : '<span class="sub">0</span>'}</td>
                  </tr>
                  ${open ? `<tr class="run-output"><td colspan="4"><pre class="log" data-log="${esc(key)}">${body}</pre></td></tr>` : ""}`;
              })
              .join("")}</tbody></table>`
          : `<p class="sub">No runs logged yet.${hook.logFile ? ` The next run appends to <code>${esc(hook.logFile)}</code>.` : " The script redirects its output nowhere detectable."}</p>`;
        const status = !live.loaded
          ? { cls: "unloaded", text: "sleepwatcher not loaded" }
          : latest && !latest.end
            ? { cls: "running", text: "running" }
            : latest
              ? { cls: latest.exit === 0 ? "ok" : "fail", text: `last ran ${relative(latest.start)}` }
              : { cls: "", text: "never logged" };
        return `
          <section class="hook">
            <div class="hook-head">
              <div class="agent-id">
                <span class="icon" style="--accent:${hook.kind === "sleep" ? "#9b7cf0" : "#d99a2b"}">
                  <svg viewBox="0 0 24 24" aria-hidden="true">${ICONS[hook.kind === "sleep" ? "moon" : "sun"]}</svg>
                  <span class="dot ${status.cls}" title="${esc(status.text)}"></span>
                </span>
                <span class="names">
                  <span class="name">${esc(hook.name)} hook</span>
                  <span class="desc">Runs ${hook.kind === "sleep" ? "as the Mac goes to sleep" : "each time the Mac wakes"} · ${esc(status.text)}</span>
                </span>
              </div>
              <dl>
                <dt>Trigger</dt><dd><code>${esc(hook.trigger ?? "not configured")}</code>${hook.script ? ` → <code>${esc(hook.script)}</code>` : ""}</dd>
                ${hook.source ? `<dt>Source</dt><dd><code>${esc(hook.source)}</code> <span class="tag">chezmoi</span></dd>` : ""}
                <dt>Log</dt><dd>${hook.logFile ? `<code>${esc(hook.logFile)}</code>` : '<span class="sub">none</span>'}</dd>
              </dl>
            </div>
            <div class="hook-grid">
              <div><h3>Steps</h3>${steps}</div>
              <div><h3>Recent runs</h3>${runs}</div>
            </div>
          </section>`;
      }

      function renderHooks() {
        if (!hookData) return;
        document.getElementById("updated").textContent =
          `Updated ${new Date(hookData.generatedAt).toLocaleTimeString()}`;
        const scroll = new Map(
          [...sleepView.querySelectorAll("pre[data-log]")].map((pre) => [pre.dataset.log, pre.scrollTop]),
        );
        const sw = hookData.sleepwatcher;
        const swState = sw.live.loaded
          ? `<b>${esc(sw.live.state ?? "loaded")}</b>${sw.live.pid ? ` · pid ${esc(sw.live.pid)}` : ""}`
          : '<b class="fail-text">not loaded</b>';
        sleepView.innerHTML = `
          <p class="notice">The <code>${esc(sw.label)}</code> agent (${swState}) runs these scripts on power events.
          Sleepwatcher discards their output, so each script logs its runs between <code>=== sleepwatcher … ===</code> markers.</p>
          ${hookData.hooks.map((hook) => hookCard(hook, sw.live)).join("")}`;
        for (const pre of sleepView.querySelectorAll("pre[data-log]")) {
          pre.scrollTop = scroll.has(pre.dataset.log) ? scroll.get(pre.dataset.log) : pre.scrollHeight;
        }
      }

      function toggleRun(row) {
        const { kind, start } = row.dataset;
        openRuns.set(kind, openRuns.get(kind) === start ? null : start);
        renderHooks();
        sleepView.querySelector(`tr.run[data-kind="${CSS.escape(kind)}"][data-start="${CSS.escape(start)}"]`)?.focus();
      }

      sleepView.addEventListener("click", (event) => {
        const row = event.target.closest("tr.run");
        if (row) toggleRun(row);
      });
      sleepView.addEventListener("keydown", (event) => {
        const row = event.target.closest("tr.run");
        if (row && (event.key === "Enter" || event.key === " ")) {
          event.preventDefault();
          toggleRun(row);
        }
      });

      function selectTab() {
        tab = location.hash === "#sleep" ? "sleep" : "agents";
        document.body.dataset.tab = tab;
        document.getElementById("agents-view").hidden = tab !== "agents";
        sleepView.hidden = tab !== "sleep";
        for (const link of document.querySelectorAll(".tabs a")) {
          link.setAttribute("aria-selected", String(link.dataset.tab === tab));
        }
        if (tab === "sleep") renderHooks();
        else render();
        refresh();
      }
      window.addEventListener("hashchange", selectTab);

      async function refresh() {
        const sleep = tab === "sleep";
        try {
          const response = await fetch(sleep ? "/api/hooks" : "/api/agents", { cache: "no-store" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          if (sleep) {
            hookData = await response.json();
            renderHooks();
          } else {
            data = await response.json();
            render();
          }
        } catch (error) {
          document.getElementById("updated").innerHTML =
            `<span class="fail-text">Refresh failed: ${esc(error.message)}</span>`;
        }
      }

      selectTab();
      setInterval(refresh, 15000);
    </script>
  </body>
</html>
