# pnpm 11 defaults verify-deps-before-run to "install", which prints
# "Already up to date / Done in Xms" before every `pnpm exec`/`pnpm run`
# (twice for bare `pnpm <bin>` invocations like ni's `na`). Disable it;
# run `pnpm install` manually after lockfile changes.
verifyDepsBeforeRun: false

# pnpm supply-chain policy.
#
# pnpm 11 reads registry/auth settings from rc/.npmrc, but all other settings
# live here or in a project's pnpm-workspace.yaml.
#
# Packages exempt from the cooldown: our own published packages, the TypeScript
# toolchain we bump often, the Effect-TS ecosystem used in sablier/new-ui, the
# Medusa backend packages used in 28zile, and MCP
# servers we run via `pnpm dlx`/`bunx` pinned to `@latest` (the cooldown would
# otherwise stall every fresh release). `effect`/`sablier`/`typescript` are
# unscoped, so a `@scope/*` glob wouldn't cover them — entries are explicit to
# match the exact set and mirror bun (which cannot glob at all). Keep this list
# identical to minimumReleaseAgeExcludes in ~/.config/.bunfig.toml and
# min-release-age-exclude in ~/.config/npm/npmrc;
# tests/release_age_excludes.bats enforces it.
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - "@effect-atom/atom"
  - "@effect-atom/atom-react"
  - "@effect/cli"
  - "@effect/experimental"
  - "@effect/opentelemetry"
  - "@effect/platform"
  - "@effect/platform-browser"
  - "@effect/platform-bun"
  - "@effect/platform-node"
  - "@effect/platform-node-shared"
  - "@effect/rpc"
  - "@effect/vitest"
