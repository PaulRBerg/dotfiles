# Minimal, fast Starship config

add_newline = false
command_timeout = 2000
format = "$directory$git_branch$git_status$hostname$jobs$status$character"
right_format = "$cmd_duration"
scan_timeout = 20

[directory]
  truncate_to_repo = true
  truncation_length = 3

[character]
  error_symbol = "[>](bold red)"
  success_symbol = "[>](bold green)"

[cmd_duration]
  format = "[$duration]($style)"
  min_time = 1000
  style = "yellow"

[status]
  disabled = false
  pipestatus = true

[jobs]

[hostname]
  ssh_only = true
